<!doctype html>
<html lang="kr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/config.js"></script>
    <link
            rel="stylesheet"
            href="../css/login.css"
            crossorigin="anonymous"
    />
    <title>회원정보 수정 — TRIPFEED</title>
</head>
<body class="site-page settings-page profile-settings-page">
<main class="wrap">
    <section class="settingsCard">
    <div class="settingsHeading">
        <p class="eyebrow">MY PROFILE</p>
        <h1 class="title">회원정보 수정</h1>
        <p>다른 여행자들에게 보여질 프로필 정보를 관리하세요.</p>
    </div>
    <article>
        <div class="profileUploadContainer">
            <img
                    id="profilePreview"
                    alt="프로필 사진 미리보기"
                    style="max-width: 100px; max-height: 100px"
            />
            <button
                    type="button"
                    id="removeProfileButton"
                    class="profileRemoveButton"
                    aria-label="프로필 이미지 제거"
            >
                ×
            </button>
            <label for="profile" class="profileUploadButton">
                변경
            </label>
            <input
                    type="file"
                    name="profile"
                    id="profile"
                    placeholder="프로필 사진을 업로드 해주세요"
                    accept="image/*,.heic,.heif"
                    style="display: none"
            />
        </div>
        <p id="profileUploadNotice" class="profileUploadNotice">
            JPG, PNG, WEBP, GIF, HEIC · 최대 10MB
        </p>
        <div class="inputBox">
            <label>이메일</label>
            <p class="defaultText" id="id"></p>
        </div>
        <div class="inputBox">
            <label for="pwck">닉네임*</label>
            <input
                    type="text"
                    name="nickname"
                    id="nickname"
                    placeholder="닉네임을 입력해 주세요"
            />
            <p class="helperText" name="nickname"></p>
        </div>
        <div class="buttons">
            <button id="signupBtn">수정하기</button>
            <a id="withdrawBtn">회원 탈퇴</a>
        </div>
        <div id="toastContainer"></div>
    </article>
    </section>
</main>
<script src="../js/modifyInfo.js" type="module"></script>
</body>
</html>
