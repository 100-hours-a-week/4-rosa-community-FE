<!doctype html>
<html lang="kr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/config.js"></script>
    <title>게시글 수정</title>
    <link
            rel="stylesheet"
            href="../css/board-write.css"
            crossorigin="anonymous"
    />
</head>
<body class="site-page editor-page">
<main class="wrap">
    <section class="editorCard">
    <div class="editorHeading">
        <p class="eyebrow">EDIT YOUR STORY</p>
        <h1>여행 이야기 다듬기</h1>
        <p>공유한 정보와 기록을 더 정확하고 풍성하게 다듬어보세요.</p>
    </div>
    <div class="inputBox">
        <label for="category">카테고리 <span>*</span></label>
        <select id="category" required>
            <option value="">카테고리를 선택해 주세요.</option>
        </select>
    </div>
    <div class="inputBox">
        <label for="title">제목 <span>*</span></label>
        <input
                type="text"
                id="title"
                placeholder="제목을 입력해 주세요. (최대 26자)"
        />
    </div>
    <div class="inputBox">
        <label for="content">내용 <span>*</span></label>
        <textarea id="content"></textarea>
        <p class="helperText" name="content"></p>
    </div>
    <div class="inputBox">
        <label class="non-border" for="image">대표 이미지</label>
        <div id="imagePreview" class="imagePreview isHidden">
            <img alt="대표 이미지 미리보기" />
            <div>
                <p id="imagePreviewText"></p>
                <button id="removeImageButton" type="button">이미지 제거</button>
            </div>
        </div>
        <input
                class="non-border"
                type="file"
                id="image"
                placeholder="파일을 선택해주세요."
                accept="image/*,.heic,.heif"
        />
    </div>
    <p class="uploadNotice">JPG, PNG, WEBP, GIF, HEIC · 최대 10MB</p>
    <button id="submit">수정 내용 저장</button>
    </section>
</main>
<script src="../js/board-write.js" type="module"></script>
</body>
</html>
