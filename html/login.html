<!doctype html>
<html lang="kr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/config.js"></script>
    <link rel="stylesheet" href="../css/login.css" crossorigin="anonymous" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.7.6/lottie.min.js"></script>
    <title>로그인</title>
  </head>
  <body class="auth-page login-page">
    <main class="authShell">
      <section class="authVisual" aria-hidden="true">
        <div class="authVisualShade"></div>
        <div class="authVisualContent">
          <p>TRIPFEED · TRAVEL COMMUNITY</p>
          <h1>여행을 찾고,<br />기록하고,<br />함께하세요!</h1>
          <span>정보를 찾고 기록을 공유하며, 질문하고 동행을 만나보세요.</span>
        </div>
      </section>
      <section class="authPanel">
        <div class="authContent">
          <div class="authHeading">
            <a class="authBrand" href="/">TRIPFEED</a>
            <h1 class="title">다시 만나 반가워요.</h1>
            <p>로그인하고 나만의 여행 피드를 이어가세요.</p>
          </div>
          <article>
            <div class="inputBox">
              <label for="id">이메일</label>
              <input
                type="text"
                name="id"
                id="id"
                placeholder="이메일을 입력하세요"
              />
              <div id="lottie-animation" class="lottie"></div>
            </div>
            <div class="inputBox">
              <label for="pw">비밀번호</label>
              <input
                type="password"
                name="pw"
                id="pw"
                placeholder="비밀번호를 입력하세요"
              />
              <p class="helperText"></p>
            </div>
            <div class="buttons">
              <button id="login">로그인</button>
              <p class="authSwitch">
                처음이신가요? <a href="signup.html">회원가입</a>
              </p>
            </div>
          </article>
        </div>
      </section>
    </main>
    <script src="../js/login.js" type="module"></script>
  </body>
</html>
