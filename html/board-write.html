<!doctype html>
<html lang="kr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/config.js"></script>
    <title>게시글 작성</title>
    <link
      rel="stylesheet"
      href="../css/board-write.css"
      crossorigin="anonymous"
    />
  </head>
  <body class="site-page editor-page">
    <main class="wrap">
      <section class="editorCard">
        <div class="editorHeading">
          <p class="eyebrow">SHARE YOUR JOURNEY</p>
          <h1>여행 글 남기기</h1>
          <p>
            정보와 후기, 궁금한 질문이나 함께할 동행 소식을 자유롭게 나눠보세요.
          </p>
        </div>
        <div class="inputBox">
          <label for="category">카테고리 <span>*</span></label>
          <select id="category" required>
            <option value="">카테고리를 선택해 주세요.</option>
          </select>
        </div>
        <div class="inputBox">
          <label for="title">제목 <span>*</span></label>
          <input
            type="text"
            id="title"
            placeholder="제목을 입력해 주세요. (최대 26자)"
          />
        </div>
        <div class="inputBox">
          <label for="content">내용 <span>*</span></label>
          <textarea id="content" placeholder="내용을 입력해 주세요."></textarea>
          <p class="helperText" name="content"></p>
        </div>
        <div class="inputBox">
          <label class="non-border" for="image">대표 이미지</label>
          <input
            class="non-border"
            type="file"
            id="image"
            placeholder="파일을 선택해주세요."
            accept="image/*"
          />
        </div>
        <p class="uploadNotice">현재 이미지 업로드 기능은 준비 중입니다.</p>
        <button id="submit">등록하기</button>
      </section>
    </main>
    <script src="../js/board-write.js" type="module"></script>
  </body>
</html>
